<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/projects.css">
    <link rel="stylesheet" href="css/footer.css">

    <title>Michelle Portelli | Game Programmer</title>
</head>

<body>

    <header id="site-header" class="site-header"></header>


    <main>

        <!-- ---------- Hero ---------- -->

        <section class="hero">

            <!-- Background Visual -->

            <div class="hero-visual" aria-hidden="true">

                <div class="hero-grid"></div>

                <div class="hero-grid-glow"></div>

            </div>


            <!-- Hero Content -->

            <div class="hero-content">

                <p class="hero-intro">
                    HI, I'M MICHELLE OR
                </p>

                <h1>SHELLY</h1>

                <h2>GAME PROGRAMMER</h2>

                <p class="hero-description">
                    Gameplay • UI/UX • Technical Systems
                </p>

                <div class="hero-skills">
                    <span>C#</span>
                    <span>C++</span>
                    <span>Unreal Engine</span>
                    <span>Unity</span>
                </div>

                <a href="projects.html" class="primary-button">
                    View My Work →
                </a>

            </div>

        </section>


        <!-- ---------- Project Highlights ---------- -->

        <section class="project-highlights">

            <div class="section-heading">

                <h2>PROJECT HIGHLIGHTS</h2>

                <a href="projects.html" class="view-all">
                    View all projects →
                </a>

            </div>


            <div class="highlight-grid">

                <!-- Waveform -->

                <a href="projects/waveform.html" class="project-card">

                    <div class="project-card-media">

                        <img
                            src="images/projects/waveform.jpg"
                            alt="Waveform"
                            class="project-image"
                        >

                        <img
                            src="images/projects/waveform.gif"
                            alt=""
                            class="project-gif"
                        >

                    </div>

                    <div class="project-card-info">
                        <span>Waveform</span>
                        <span>→</span>
                    </div>

                </a>


                <!-- Voleur -->

                <a href="projects/voleur.html" class="project-card">

                    <div class="project-card-media">

                        <img
                            src="images/projects/voleur.jpg"
                            alt="Voleur"
                            class="project-image"
                        >

                        <img
                            src="images/projects/voleur.gif"
                            alt=""
                            class="project-gif"
                        >

                    </div>

                    <div class="project-card-info">
                        <span>Voleur!</span>
                        <span>→</span>
                    </div>

                </a>


                <!-- Curtainfall -->

                <a href="projects/curtainfall.html" class="project-card">

                    <div class="project-card-media">

                        <img
                            src="images/projects/curtainfall.jpg"
                            alt="Curtainfall"
                            class="project-image"
                        >

                        <img
                            src="images/projects/curtainfall.gif"
                            alt=""
                            class="project-gif"
                        >

                    </div>

                    <div class="project-card-info">
                        <span>Curtainfall</span>
                        <span>→</span>
                    </div>

                </a>

            </div>

        </section>

    </main>


    <footer id="site-footer" class="site-footer"></footer>


    <script src="js/navigation.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/theme.js"></script>
